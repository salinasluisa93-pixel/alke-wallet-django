{% extends 'base.html' %}
{% block title %}Eliminar cuenta | Alke Wallet{% endblock %}
{% block content %}<div class="form-card"><p class="eyebrow">Acción irreversible</p><h1>¿Eliminar {{ object.numero }}?</h1><p class="muted">Esta acción no se puede deshacer y eliminará el historial asociado.</p><form method="post">{% csrf_token %}<div class="form-actions"><a class="button button-quiet" href="{% url 'gestion:cuenta-detail' object.pk %}">Cancelar</a><button class="button button-danger" type="submit">Eliminar cuenta</button></div></form></div>{% endblock %}
