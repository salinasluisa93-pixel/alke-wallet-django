<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alke Wallet — Iniciar sesión</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app-shell">
  <section class="card login-card p-4">
    <header class="d-flex align-items-center gap-2 mb-3">
      <span class="dot" style="width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#ecd48f,#a8842b);display:inline-block;margin-right:8px;"></span>
      <h1 class="h3 brand mb-0">Alke Wallet</h1>
    </header>

    <div class="glam-tabs" role="tablist">
      <button type="button" id="tabLogin" class="active">Iniciar sesión</button>
      <button type="button" id="tabRegister">Crear cuenta</button>
    </div>

    <div id="alert-container"></div>

    <!-- Formulario de login -->
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input id="email" class="form-control" type="email" placeholder="tucorreo@ejemplo.com">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" class="form-control" type="password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-block" type="submit">Ingresar</button>
      <p class="muted text-center small mt-3 mb-0">Cuenta demo: <span class="text-mono">admin@wallet.com</span> / <span class="text-mono">12345</span></p>
    </form>

    <!-- Formulario de registro -->
    <form id="registerForm" class="d-none">
      <div class="form-group">
        <label for="regName">Nombre completo</label>
        <input id="regName" class="form-control" placeholder="Nombre y apellido">
      </div>
      <div class="form-group">
        <label for="regEmail">Correo electrónico</label>
        <input id="regEmail" class="form-control" type="email" placeholder="tucorreo@ejemplo.com">
      </div>
      <div class="form-group">
        <label for="regPassword">Contraseña</label>
        <input id="regPassword" class="form-control" type="password" placeholder="Mínimo 5 caracteres">
      </div>
      <button class="btn btn-primary btn-block" type="submit">Crear cuenta</button>
    </form>
  </section>
</main>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
