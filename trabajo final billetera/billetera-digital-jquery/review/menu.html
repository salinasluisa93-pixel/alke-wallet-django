<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alke Wallet — Menú principal</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <nav class="navbar navbar-expand-md navbar-dark navbar-glam">
    <a class="navbar-brand" href="menu.html"><span class="dot"></span>Alke Wallet</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav ml-auto align-items-md-center">
        <li class="nav-item"><a class="nav-link" href="menu.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="deposit.html">Fondos</a></li>
        <li class="nav-item"><a class="nav-link" href="sendmoney.html">Enviar / Recibir</a></li>
        <li class="nav-item"><a class="nav-link" href="transactions.html">Movimientos</a></li>
        <li class="nav-item"><button id="logoutBtn" class="btn btn-outline-primary btn-sm ml-md-2 my-2 my-md-0">Cerrar sesión</button></li>
      </ul>
    </div>
  </nav>
</header>

<main class="app-shell">
  <h1 class="h3 mb-3">Menú principal</h1>
  <div id="menu-alert"></div>

  <section class="card hero-card p-4 mb-4">
    <p class="muted mb-1">Saldo actual</p>
    <div id="menuBalance" class="balance"></div>
  </section>

  <div class="row">
    <div class="col-md-4 mb-3">
      <button class="action-card card p-3 w-100 text-left menu-action border-0" data-screen="deposit.html" data-label="depósito">
        <span class="action-icon mb-2 d-inline-flex">💰</span>
        <div class="font-weight-bold">Depositar / Retirar</div>
        <small class="muted">Gestioná tu saldo</small>
      </button>
    </div>
    <div class="col-md-4 mb-3">
      <button class="action-card card p-3 w-100 text-left menu-action border-0" data-screen="sendmoney.html" data-label="enviar dinero">
        <span class="action-icon mb-2 d-inline-flex">📤</span>
        <div class="font-weight-bold">Enviar / Recibir</div>
        <small class="muted">Transferí a tus contactos</small>
      </button>
    </div>
    <div class="col-md-4 mb-3">
      <button class="action-card card p-3 w-100 text-left menu-action border-0" data-screen="transactions.html" data-label="últimos movimientos">
        <span class="action-icon mb-2 d-inline-flex">🧾</span>
        <div class="font-weight-bold">Últimos movimientos</div>
        <small class="muted">Revisá tu historial</small>
      </button>
    </div>
  </div>
</main>

<footer class="app-footer">Alke Wallet · Proyecto educativo, sin backend real</footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
