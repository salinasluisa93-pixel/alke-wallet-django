<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alke Wallet — Enviar / Recibir</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <nav class="navbar navbar-expand-md navbar-dark navbar-glam">
    <a class="navbar-brand" href="menu.html"><span class="dot"></span>Alke Wallet</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav ml-auto align-items-md-center">
        <li class="nav-item"><a class="nav-link" href="menu.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="deposit.html">Fondos</a></li>
        <li class="nav-item"><a class="nav-link active" href="sendmoney.html">Enviar / Recibir</a></li>
        <li class="nav-item"><a class="nav-link" href="transactions.html">Movimientos</a></li>
        <li class="nav-item"><button id="logoutBtn" class="btn btn-outline-primary btn-sm ml-md-2 my-2 my-md-0">Cerrar sesión</button></li>
      </ul>
    </div>
  </nav>
</header>

<main class="app-shell">
  <h1 class="h3 mb-3">Enviar / Recibir dinero</h1>
  <div id="alert-container"></div>

  <div class="glam-tabs" style="max-width:320px;">
    <button type="button" id="tabSend" class="active">Enviar</button>
    <button type="button" id="tabReceive">Recibir</button>
  </div>

  <!-- ===================== ENVIAR DINERO ===================== -->
  <section id="sendSection">
    <button type="button" class="btn btn-outline-primary mb-3" data-toggle="modal" data-target="#contactModal">
      + Agregar nuevo contacto
    </button>

    <div class="form-group autocomplete-wrap">
      <label for="search">Buscar por nombre o alias</label>
      <input id="search" class="form-control" placeholder="Escribí para buscar..." autocomplete="off">
      <div id="autocompleteResults" class="autocomplete-results"></div>
    </div>

    <div id="contactsList" class="list-group mb-3"></div>

    <section id="sendPanel" class="card p-3 d-none">
      <p>Contacto seleccionado: <strong id="selectedContact"></strong></p>
      <form id="sendForm">
        <div class="form-group">
          <label for="sendAmount">Monto</label>
          <input id="sendAmount" class="form-control" type="number" min="1" placeholder="Ej: 15000">
        </div>
        <button class="btn btn-primary" type="submit">Enviar dinero</button>
      </form>
    </section>
  </section>

  <!-- ===================== RECIBIR DINERO ===================== -->
  <section id="receiveSection" class="card p-4 d-none">
    <p class="muted">Simulá que alguien te transfiere dinero a tu cuenta Alke Wallet.</p>
    <form id="receiveForm">
      <div class="form-group">
        <label for="senderName">¿Quién te envía el dinero?</label>
        <input id="senderName" class="form-control" placeholder="Ej: Ana Fernández">
      </div>
      <div class="form-group">
        <label for="receiveAmount">Monto</label>
        <input id="receiveAmount" class="form-control" type="number" min="1" placeholder="Ej: 25000">
      </div>
      <button class="btn btn-primary" type="submit">Recibir dinero</button>
    </form>
  </section>
</main>

<!-- ==================== Modal: agregar contacto (Bootstrap 4) ==================== -->
<div class="modal fade" id="contactModal" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Nuevo contacto</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar"><span aria-hidden="true">&times;</span></button>
      </div>
      <div class="modal-body">
        <form id="contactForm">
          <div class="form-group">
            <label for="contactName">Nombre</label>
            <input id="contactName" class="form-control">
          </div>
          <div class="form-group">
            <label for="contactAlias">Alias</label>
            <input id="contactAlias" class="form-control">
          </div>
          <div class="form-group">
            <label for="contactCbu">CBU (22 dígitos)</label>
            <input id="contactCbu" class="form-control">
          </div>
          <button class="btn btn-primary btn-block" type="submit">Guardar contacto</button>
        </form>
      </div>
    </div>
  </div>
</div>

<footer class="app-footer">Alke Wallet · Proyecto educativo, sin backend real</footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
